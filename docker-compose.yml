services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: my-backend-dev
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: my-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend


  mongodb:
    image: mongo:8
    container_name: my-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db


volumes:
  mongodb_data: